on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_call:
    inputs:
      rust-version:
        required: false
        type: string
        default: 'stable'
      workspace:
        required: false
        type: string
        default: '.'
      setup-protoc:
        required: false
        type: boolean
        default: false
      coverage-threshold:
        required: false
        type: number
        default: 0
      test-command:
        required: false
        type: string
        default: 'cargo test --workspace'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Rust Quality Gate



permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env
        with:
          rust-version: ${{ inputs.rust-version || 'stable' }}
          rust-components: rustfmt,clippy
          setup-protoc: ${{ inputs.setup-protoc || false }}
          workspace: ${{ inputs.workspace || '.' }}

      - uses: ./.github/actions/run-tests
        with:
          test-command: ${{ inputs.test-command || 'cargo test --workspace' }}
          lint-command: cargo clippy --workspace -- -D warnings
          format-check: 'true'
          working-directory: ${{ inputs.workspace || '.' }}

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env
        with:
          rust-version: nightly
          setup-protoc: ${{ inputs.setup-protoc || false }}
          workspace: ${{ inputs.workspace || '.' }}

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        working-directory: ${{ inputs.workspace || '.' }}
        run: cargo tarpaulin --workspace --out xml --output-dir coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: ${{ inputs.workspace || '.' }}/coverage/cobertura.xml
          flags: rust
          fail_ci_if_error: false

  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-env
        with:
          rust-version: stable
          workspace: ${{ inputs.workspace || '.' }}

      - uses: ./.github/actions/security-checks
        with:
          cargo-audit: 'true'
          cargo-deny: 'true'
          gitleaks: 'false'
          python-bandit: 'false'
          working-directory: ${{ inputs.workspace || '.' }}
