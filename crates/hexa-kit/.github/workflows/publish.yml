on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      registry:
        required: true
        type: string
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false
      PYPI_TOKEN:
        required: false
      CARGO_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Publish Package



permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d

      - name: Build
        run: mise run build

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          REGISTRY: ${{ inputs.registry }}
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          case "$REGISTRY" in
            npm) npm publish --tag "$VERSION" ;;
            pypi) twine upload dist/* ;;
            crates.io) cargo publish ;;
          esac

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          LANGUAGE: ${{ inputs.language }}
          REGISTRY: ${{ inputs.registry }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "Dry run: Would publish $LANGUAGE package version $VERSION to $REGISTRY"
