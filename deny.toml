[advisories]
version = 2
unmaintained = "none"
unsound = "all"
yanked = "warn"

[bans]
multiple-versions = "deny"
wildcards = "deny"
workspace-default-features = "deny"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
]
