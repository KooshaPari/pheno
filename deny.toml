[advisories]
version = 2
unmaintained = "none"
unsound = "all"
yanked = "warn"
ignore = [
    # RUSTSEC-2026-0049/0098/0099/0104: rustls-webpki <0.103.13 chain
    # pulled in by async-nats 0.46.1 (agileplus-git pin).
    # Resolution: bump async-nats to 0.47+ once it leaves pre-release,
    # then re-pin and remove these ignore entries. Tracked under
    # plans/dockets/O21-rustls-webpki-chain.md.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # RUSTSEC-2026-0002/0253: lru 0.12.5 (via ratatui 0.26.3) and
    # lru 0.16.4 (via moka 0.12). Both pinned by major-version-sensitive
    # crate APIs (ratatui widget API, moka::Cache API). Resolution:
    # bump ratatui to 0.29+ and moka to 0.13+ in a coordinated PR
    # touching the TUI crates. Tracked under plans/dockets/O22-ratatui-moka.md.
    "RUSTSEC-2026-0002",
    "RUSTSEC-2026-0253",
    # RUSTSEC-2021-0145: atty 0.2.14 unmaintained + unaligned read.
    # Pulled by pheno-forge-smoke via `termion` lineage. Resolution:
    # replace termion-style stderr-tty detection with std::io::IsTerminal
    # (stable since Rust 1.70) in pheno-forge-smoke. Trivial change,
    # tracked under plans/dockets/O23-pheno-forge-smoke-modernize.md.
    "RUSTSEC-2021-0145",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
workspace-default-features = "deny"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
]
