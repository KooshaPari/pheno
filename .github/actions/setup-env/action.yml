name: 'Setup Environment'
description: 'Checkout code, setup Rust toolchain, cache dependencies, and optionally install protoc'

inputs:
  rust-version:
    description: 'Rust toolchain version to install'
    required: false
    default: 'stable'
  setup-protoc:
    description: 'Install protoc compiler'
    required: false
    default: 'false'
  checkout-depth:
    description: 'Fetch depth for checkout (0 = full history)'
    required: false
    default: '1'
  rust-components:
    description: 'Comma-separated list of Rust components to install (e.g., rustfmt,clippy)'
    required: false
    default: ''
  workspace:
    description: 'Cargo workspace path for caching'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      with:
        fetch-depth: ${{ inputs.checkout-depth }}

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2  # v6.0.0
      with:
        components: ${{ inputs.rust-components }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      with:
        workspaces: ${{ inputs.workspace }}

    - name: Setup protoc
      if: inputs.setup-protoc == 'true'
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3.0.0
      with:
        version: "28.x"
        repo-token: ${{ github.token }}
