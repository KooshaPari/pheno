name: cargo-machete
permissions: read-all

on:
  push:
    branches: [main]
    paths: ['Cargo.toml', '**/Cargo.toml']
  pull_request:
    paths: ['Cargo.toml', '**/Cargo.toml']
  schedule:
    - cron: '47 6 * * 4'  # weekly Thursday
  workflow_dispatch:

jobs:
  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.1
      - name: Initialize AgilePlus submodule
        run: |
          git submodule sync -- agileplus
          git submodule update --init --depth 1 -- agileplus
      - uses: bnjbvr/cargo-machete@v0.9.2
