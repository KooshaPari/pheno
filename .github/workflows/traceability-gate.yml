name: Traceability Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      
      - name: Set up Python
        uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48 # v-latest
        with:
          python-version: '3.14'
          
      - name: Run Traceability Check (soft mode)
        # Soft-fail default pending FR-TRACE-BACKFILL-001. Re-enable strict with
        # `--strict-annotations` once the 46 missing IDs are backfilled.
        run: |
          python scripts/traceability-check.py