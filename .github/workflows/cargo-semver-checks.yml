name: cargo-semver-checks
permissions: read-all

on:
  pull_request:
    paths: ['**/Cargo.toml']
  workflow_dispatch:

jobs:
  semver-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.1
      - name: Ensure AgilePlus workspace sources
        run: |
          if [ ! -f agileplus/crates/agileplus-dashboard/Cargo.toml ]; then
            rm -rf agileplus
            git clone --depth 1 --branch main https://github.com/KooshaPari/AgilePlus.git agileplus
          fi
      - uses: obi1kenobi/cargo-semver-checks-action@v2
